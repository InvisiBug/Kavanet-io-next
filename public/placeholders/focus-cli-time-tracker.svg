  <text x="160" y="220" font-size="34" fill="#93c5fd" font-family="Courier New, monospace">$ focus start --tag work</text>
  <text x="160" y="285" font-size="34" fill="#a7f3d0" font-family="Courier New, monospace">Session started: 09:15</text>
