apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: { { .Values.httpRoute.name } }
  namespace: { { .Values.namespace } }
spec:
  parentRefs:
    - name: { { .Values.httpRoute.gateWayName } }
      sectionName: http
    - name: { { .Values.httpRoute.gateWayName } }
      sectionName: https
  hostnames:
    - { { .Values.httpRoute.host | quote } }
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: { { .Values.httpRoute.path | quote } }
      backendRefs:
        - name: { { .Values.httpRoute.serviceName } }
          port: { { .Values.httpRoute.servicePort } }
