{{- range $ingress := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ingress.name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/proxy-body-size: 1G
spec:
  rules:
    - {{- if $ingress.host }}
      host: {{ $ingress.host }}
      {{- end }}
      http:
        paths:
          - path: {{ $ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $ingress.selector }}
                port:
                  number: {{ $ingress.port }}
  {{- if $ingress.host }}
  tls:
    - hosts:
        - {{ $ingress.host }}
      secretName: {{ $ingress.host }}-tls
  {{- end }}
---
{{- end }}