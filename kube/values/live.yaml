name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 9cca4085dad1bec05e435b55196484df25690c38

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /.*
    port: 80
    host: kavanet-io

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
