name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 1517f34c33ba69eae22dbd037157697b7cec2384

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /
    port: 80
    host: kavanet.io

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
