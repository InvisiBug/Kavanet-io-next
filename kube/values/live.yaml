name: kavanet-io

namespace: kavanest
env:
  APP_VERSION: 7da9a01307063e16c1497daf1b410b1dd2dccf10

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /.*
    port: 80
    host: kavanet-io.co.uk

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
