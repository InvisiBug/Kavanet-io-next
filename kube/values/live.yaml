name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 1cdcc818637bf5077a3728a666c4c7e7f9a74ec8

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

gateway:
  name: kavanet-gateway
  gatewayClassName: nginx
  host: kavanet.io
  tlsSecretName: kavanet.io-tls

httpRoute:
  name: kavanet-io
  host: kavanet.io
  path: /
  serviceName: kavanet-io
  servicePort: 80

service:
  clusterIP:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
