name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 464819f93cf169b3c6a84b7edf2f5e04ea37bd60

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /
    port: 80
    host: kavanet.io

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
