name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: a1fe51e77e46acfc87cdd263b3ac9372229fe1c8

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live
    # Coredump

# gateway:
#   name: kavanet-gateway
#   gatewayClassName: nginx
#   host: kavanet.io
#   tlsSecretName: kavanet.io-tls

httpRoute:
  name: kavanet-io
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: kavanet.io
  path: /
  serviceName: kavanet-io
  servicePort: 80

service:
  name: kavanet-io
  selector: kavanet-io
  port: 80
  targetPort: 80
