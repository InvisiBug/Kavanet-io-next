name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 3d2be446548d22541b85c1aa746077f20773c5ed

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /
    port: 80
    host: kavanet.io

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
