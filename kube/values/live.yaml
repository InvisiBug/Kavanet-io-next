name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 32706c810c4b8ed1beea855d47e275149e86d015

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /.*
    port: 80
    host: kavanet-io.co.uk

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
