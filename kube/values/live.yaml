name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 0d4cdd4f62ff567b2da7959b6d3bdbab8882aad7

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /
    port: 80
    host: kavanet.io

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
