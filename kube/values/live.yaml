name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 424a23ff0a95487b256a8683746df7497a54a63e

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

gateway:
  name: kavanet-gateway
  gatewayClassName: nginx
  host: kavanet.io
  tlsSecretName: kavanet.io-tls

httpRoute:
  name: kavanet-io
  host: kavanet.io
  path: /
  serviceName: kavanet-io
  servicePort: 80

service:
  clusterIP:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
