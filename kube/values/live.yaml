name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 20a3d69035c799d48d1a58e0b5f8fd2cad1f2769

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
  - name: kavanet-io
    selector: kavanet-io
    path: /
    port: 80
    host: kavanet.io

service:
  loadBalancer:
    - name: kavanet-io
      selector: kavanet-io
      port: 80
