name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: beee12053685908257a8f5fa2e461f98eeb1f6b8

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

httpRoute:
  name: kavanet-io
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: kavanet.io
  path: /
  serviceName: kavanet-io
  servicePort: 80

service:
  name: kavanet-io
  selector: kavanet-io
  port: 80
  targetPort: 80
