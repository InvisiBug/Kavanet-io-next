name: kavanet-io

namespace: kavanet-io
env:
  APP_VERSION: 2342c996e82f7bc96aa551604c9831cb89b261e7

deployment:
  - name: kavanet-io
    image: invisibug/kavanet-io
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

httpRoute:
  name: kavanet-io
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: kavanet.io
  path: /
  serviceName: kavanet-io
  servicePort: 80

service:
  name: kavanet-io
  selector: kavanet-io
  port: 80
  targetPort: 80
